[project]
name = "shipping-python-ch17-streaming"
version = "1.0.0"
description = "Ch17 streaming-at-scale — gRPC TrackingService.WatchShipment, async-generator pull vs eager pre-materialization (Python side)."
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.83,<2",
    "grpcio-reflection>=1.83,<2",
    "protobuf>=6.33.5,<8",
    "opentelemetry-distro>=0.50b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    "opentelemetry-instrumentation-grpc>=0.50b0",
]

# grpcio-tools is build-time only (generates stubs from contracts/proto/ —
# see Containerfile); the runtime image never needs it.
[dependency-groups]
dev = [
    "grpcio-tools>=1.83,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
