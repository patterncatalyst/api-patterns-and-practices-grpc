# Ch17 streaming-at-scale example — Quarkus TrackingService.
#
# gRPC server: listens on its own port (NOT the HTTP port), bound to 0.0.0.0
# so it is reachable from outside the container. Container port 9000, mapped
# to host 9170 by compose.yaml.
quarkus.grpc.server.port=9000
quarkus.grpc.server.host=0.0.0.0

# Server reflection is on by default in dev mode only; verify.sh drives this
# over grpcurl's reflection client in every mode (including the packaged
# container), so it must be explicit here.
quarkus.grpc.server.enable-reflection-service=true

# --- Keepalive on a long-lived stream ---------------------------------------
# quarkus.grpc.server.use-separate-server defaults to true, which is what
# puts grpc-java's own Netty server (not the Vert.x HTTP server) in front of
# this service — the mode whose keepalive knobs live under
# quarkus.grpc.server.netty.*. Confirmed against the io.quarkus:quarkus-grpc
# 3.40.1 jar: there is no quarkus.grpc.server.keep-alive-time directly on
# GrpcServerConfiguration; the three keepalive properties are nested one
# level deeper, under GrpcServerConfiguration$GrpcServerNettyConfig, and map
# straight onto grpc-java's NettyServerBuilder#keepAliveTime /
# #permitKeepAliveTime / #permitKeepAliveWithoutCalls.
#
#   netty.keep-alive-time               — how often THIS server pings an
#                                          otherwise-silent client to prove
#                                          the connection is still alive.
#   netty.permit-keep-alive-time        — the shortest ping interval this
#                                          server accepts from a CLIENT's own
#                                          keepalive pings before treating
#                                          them as abusive and tearing down
#                                          the connection (GOAWAY with
#                                          ENHANCE_YOUR_CALM).
#   netty.permit-keep-alive-without-calls — whether a client may keep pinging
#                                          on a connection with no RPC
#                                          currently in flight (true here so a
#                                          caller holding a channel open
#                                          between WatchShipment calls can
#                                          still keep it warm).
quarkus.grpc.server.netty.keep-alive-time=30s
quarkus.grpc.server.netty.permit-keep-alive-time=10s
quarkus.grpc.server.netty.permit-keep-alive-without-calls=true

# OTLP endpoint for the opt-in `observability` compose profile. Falls back to
# the OTel SDK default (http://localhost:4317) when OTEL_EXPORTER_OTLP_ENDPOINT
# is unset, which simply fails to export (logged, non-fatal) when no
# collector is listening — the service starts and serves WatchShipment
# either way.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=ch17-streaming-quarkus
