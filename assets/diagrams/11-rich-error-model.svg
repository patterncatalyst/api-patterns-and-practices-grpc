<text x="326.0" y="527.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">retryable</text>
<text x="326.0" y="527.0" font-size="11" fill="#b8650a" text-anchor="middle">retryable</text>
<path d="M560,510 L680,556" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="626.0" y="527.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">not retryable</text>
<text x="626.0" y="527.0" font-size="11" fill="#555" text-anchor="middle">not retryable</text>
<text x="480" y="668" font-size="11" fill="#555555" text-anchor="middle">The code says whether to retry; details[] say what to tell a human and how long to wait.</text>
</svg>