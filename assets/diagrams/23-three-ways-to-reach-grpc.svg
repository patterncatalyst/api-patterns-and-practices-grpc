<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="30" width="280" height="320" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="50" font-size="12" font-weight="700" fill="#1d1d1d">1. Hand-written REST shim</text>
<rect x="320" y="30" width="280" height="320" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="332" y="50" font-size="12" font-weight="700" fill="#1d1d1d">2. Envoy JSON transcoder</text>
<rect x="620" y="30" width="280" height="320" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="632" y="50" font-size="12" font-weight="700" fill="#1d1d1d">3. Envoy grpc-web</text>
<rect x="35" y="75" width="250" height="255" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="160.0" y="140.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">BookingResource / booking_quote</text>
<text x="160.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">needs:</text>
<text x="160.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">one handler per RPC,</text>
<text x="160.0" y="187.5" font-size="11.5" fill="#555555" text-anchor="middle">written and maintained by hand</text>
<text x="160.0" y="202.5" font-size="11.5" fill="#555555" text-anchor="middle">URL:</text>
<text x="160.0" y="217.5" font-size="11.5" fill="#555555" text-anchor="middle">POST /booking/quote</text>
<text x="160.0" y="232.5" font-size="11.5" fill="#555555" text-anchor="middle">content-type:</text>
<text x="160.0" y="247.5" font-size="11.5" fill="#555555" text-anchor="middle">application/json (custom shape)</text>
<text x="160.0" y="262.5" font-size="11.5" fill="#555555" text-anchor="middle">audience:</text>
<text x="160.0" y="277.5" font-size="11.5" fill="#555555" text-anchor="middle">app developers calling this one API</text>
<rect x="335" y="75" width="250" height="255" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="460.0" y="140.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">grpc_json_transcoder</text>
<text x="460.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">needs:</text>
<text x="460.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">a baked-in proto descriptor,</text>
<text x="460.0" y="187.5" font-size="11.5" fill="#555555" text-anchor="middle">zero hand-written mapping code</text>
<text x="460.0" y="202.5" font-size="11.5" fill="#555555" text-anchor="middle">URL:</text>
<text x="460.0" y="217.5" font-size="11.5" fill="#555555" text-anchor="middle">POST /shipping.routing.v1.RoutingService/GetQuote</text>
<text x="460.0" y="232.5" font-size="11.5" fill="#555555" text-anchor="middle">content-type:</text>
<text x="460.0" y="247.5" font-size="11.5" fill="#555555" text-anchor="middle">application/json (proto JSON mapping)</text>
<text x="460.0" y="262.5" font-size="11.5" fill="#555555" text-anchor="middle">audience:</text>
<text x="460.0" y="277.5" font-size="11.5" fill="#555555" text-anchor="middle">any JSON/HTTP client, scripts, curl</text>
<rect x="635" y="75" width="250" height="255" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="760.0" y="140.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">grpc_web filter</text>
<text x="760.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">needs:</text>
<text x="760.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">a grpc-web client library</text>
<text x="760.0" y="187.5" font-size="11.5" fill="#555555" text-anchor="middle">(the grpc-web npm package in a browser)</text>
<text x="760.0" y="202.5" font-size="11.5" fill="#555555" text-anchor="middle">URL:</text>
<text x="760.0" y="217.5" font-size="11.5" fill="#555555" text-anchor="middle">POST /shipping.routing.v1.RoutingService/GetQuote</text>
<text x="760.0" y="232.5" font-size="11.5" fill="#555555" text-anchor="middle">content-type:</text>
<text x="760.0" y="247.5" font-size="11.5" fill="#555555" text-anchor="middle">application/grpc-web+proto (framed)</text>
<text x="760.0" y="262.5" font-size="11.5" fill="#555555" text-anchor="middle">audience:</text>
<text x="760.0" y="277.5" font-size="11.5" fill="#555555" text-anchor="middle">browsers (fetch/XHR can&#x27;t speak native gRPC)</text>
<text x="460" y="20" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">Three ways in, one RoutingService.GetQuote on the other side</text>
</svg>