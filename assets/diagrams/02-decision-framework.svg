<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="20" width="610" height="700" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="40" font-size="12" font-weight="700" fill="#1d1d1d">The five decision axes</text>
<rect x="650" y="20" width="530" height="700" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="662" y="40" font-size="12" font-weight="700" fill="#1d1d1d">Where the axes land</text>
<rect x="50" y="60" width="500" height="110" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="300.0" y="105.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">1 · RPC shape</text>
<text x="300.0" y="122.5" font-size="11.5" fill="#555555" text-anchor="middle">unary · server-stream</text>
<text x="300.0" y="137.5" font-size="11.5" fill="#555555" text-anchor="middle">client-stream · bidi</text>
<rect x="50" y="190" width="500" height="110" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="300.0" y="235.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">2 · Sync call vs. stream</text>
<text x="300.0" y="252.5" font-size="11.5" fill="#555555" text-anchor="middle">single request/response</text>
<text x="300.0" y="267.5" font-size="11.5" fill="#555555" text-anchor="middle">or an ongoing flow</text>
<rect x="50" y="320" width="500" height="110" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="300.0" y="365.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">3 · Deadline &amp; budget</text>
<text x="300.0" y="382.5" font-size="11.5" fill="#555555" text-anchor="middle">every call gets a deadline</text>
<text x="300.0" y="397.5" font-size="11.5" fill="#555555" text-anchor="middle">sliced across the call chain</text>
<rect x="50" y="450" width="500" height="110" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="300.0" y="495.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">4 · Failure class &amp; retryability</text>
<text x="300.0" y="512.5" font-size="11.5" fill="#555555" text-anchor="middle">status code + idempotency</text>
<text x="300.0" y="527.5" font-size="11.5" fill="#555555" text-anchor="middle">retry / hedge or fail fast</text>
<rect x="50" y="580" width="500" height="110" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="300.0" y="625.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">5 · Concurrency model</text>
<text x="300.0" y="642.5" font-size="11.5" fill="#555555" text-anchor="middle">blocking · reactive · virtual threads</text>
<text x="300.0" y="657.5" font-size="11.5" fill="#555555" text-anchor="middle">asyncio vs. threads/GIL</text>
<rect x="680" y="310" width="200" height="140" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="780.0" y="370.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Decision</text>
<text x="780.0" y="387.5" font-size="11.5" fill="#555555" text-anchor="middle">apply all five axes</text>
<text x="780.0" y="402.5" font-size="11.5" fill="#555555" text-anchor="middle">to one interaction</text>
<rect x="940" y="80" width="210" height="100" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="1045.0" y="120.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">RoutingService.GetQuote</text>
<text x="1045.0" y="137.5" font-size="11.5" fill="#555555" text-anchor="middle">unary · tight deadline</text>
<text x="1045.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">Ch5 anchor</text>
<rect x="940" y="220" width="210" height="100" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="1045.0" y="260.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">TrackingService.WatchShipment</text>
<text x="1045.0" y="277.5" font-size="11.5" fill="#555555" text-anchor="middle">server-streaming</text>
<text x="1045.0" y="292.5" font-size="11.5" fill="#555555" text-anchor="middle">Ch8</text>
<rect x="940" y="360" width="210" height="100" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="1045.0" y="400.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">TrackingService.ReportPositions</text>
<text x="1045.0" y="417.5" font-size="11.5" fill="#555555" text-anchor="middle">client-streaming</text>
<text x="1045.0" y="432.5" font-size="11.5" fill="#555555" text-anchor="middle">Ch9</text>
<rect x="940" y="500" width="210" height="100" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="1045.0" y="540.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">RoutingService.RecomputeRoutes</text>
<text x="1045.0" y="557.5" font-size="11.5" fill="#555555" text-anchor="middle">async → Operation</text>
<text x="1045.0" y="572.5" font-size="11.5" fill="#555555" text-anchor="middle">Ch16</text>
<path d="M550,115.0 L680,380.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M550,245.0 L680,380.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M550,375.0 L680,380.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M550,505.0 L680,380.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M550,635.0 L680,380.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M880,380.0 L940,130.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M880,380.0 L940,270.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M880,380.0 L940,410.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M880,380.0 L940,550.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="1160" y="740" font-size="11" fill="#555555" text-anchor="end">Every later chapter&#x27;s Decision callout re-applies these five axes.</text>
</svg>