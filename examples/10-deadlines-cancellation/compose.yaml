# Ch10 deadline-propagation ANCHOR — compose topology for
# shipping.routing.v1.RoutingService.GetQuote calling DOWNSTREAM
# shipping.quote.v1.QuoteService.GetQuote.
#
# Default `docker compose up` brings up: quarkus, python. Each container runs
# BOTH RoutingService and QuoteService in the SAME process (see
# quarkus/application.properties and python/app/main.py) — RoutingService
# dials QuoteService over a LOOPBACK channel on its own container's port
# 9000, so the deadline genuinely crosses a real gRPC hop while the compose
# topology stays one container per stack. Both are generated from the SAME
# proto (contracts/proto/shipping/{type,routing,quote}/v1/*.proto). The build
# context for both services is the REPO ROOT so each Containerfile can COPY
# the three proto files it needs straight from contracts/ (the single source
# of truth) — see quarkus/Containerfile and python/Containerfile for the
# exact COPY lines.
#
# The LGTM observability stack is opt-in (`--profile observability`) so CI
# and a first boot stay fast; both apps are wired for OTLP export but start
# and serve GetQuote fine without a collector listening.
#
# Usage:
#   docker compose up --build                          # app stack only
#   docker compose --profile observability up --build  # + Grafana LGTM

services:
  quarkus:
    build:
      context: ../..
      dockerfile: examples/10-deadlines-cancellation/quarkus/Containerfile
    container_name: ch10-deadlines-quarkus
    ports:
      - "9100:9000"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4317

  python:
    build:
      context: ../..
      dockerfile: examples/10-deadlines-cancellation/python/Containerfile
    container_name: ch10-deadlines-python
    ports:
      - "9101:9000"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4317

  # ─── Observability (opt-in) ────────────────────────────────────────────
  # `docker compose --profile observability up` to include. Off by default
  # so CI's examples job (and a first boot) stay fast. The OTEL_EXPORTER_*
  # env vars above point at this service's name, which only resolves when
  # the profile is active — harmless (just unreachable) otherwise.
  lgtm:
    image: docker.io/grafana/otel-lgtm:0.36.0
    container_name: ch10-lgtm
    profiles: ["observability"]
    ports:
      - "3000:3000" # Grafana UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "9090:9090" # Prometheus / Mimir query
      - "3100:3100" # Loki
      - "3200:3200" # Tempo
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
