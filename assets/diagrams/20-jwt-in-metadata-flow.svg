<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="30" width="860" height="260" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="50" font-size="12" font-weight="700" fill="#1d1d1d">one HTTP/2 stream, GetQuote call</text>
<rect x="50" y="90" width="170" height="70" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="135.0" y="115.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Client</text>
<text x="135.0" y="132.5" font-size="11.5" fill="#555555" text-anchor="middle">metadata.put(&quot;authorization&quot;,</text>
<text x="135.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">&quot;Bearer &lt;jwt&gt;&quot;)</text>
<rect x="330" y="70" width="230" height="50" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5"/>
<text x="445.0" y="93.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">HEADERS frame (HPACK)</text>
<text x="445.0" y="110.0" font-size="11.5" fill="#555555" text-anchor="middle">authorization: Bearer &lt;jwt&gt;</text>
<rect x="330" y="150" width="230" height="50" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="445.0" y="173.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">DATA frame</text>
<text x="445.0" y="190.0" font-size="11.5" fill="#555555" text-anchor="middle">GetQuoteRequest (bytes)</text>
<rect x="660" y="70" width="190" height="50" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="755.0" y="93.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">AuthzInterceptor</text>
<text x="755.0" y="110.0" font-size="11.5" fill="#555555" text-anchor="middle">reads metadata first</text>
<rect x="660" y="150" width="190" height="50" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="755.0" y="173.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">GetQuote handler</text>
<text x="755.0" y="190.0" font-size="11.5" fill="#555555" text-anchor="middle">runs only if allowed</text>
<path d="M220,95 L330,95" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="281.0" y="89.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">1. sent first</text>
<text x="281.0" y="89.0" font-size="11" fill="#b8650a" text-anchor="middle">1. sent first</text>
<path d="M220,150 L330,175" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="240.0" y="142.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">2. sent after</text>
<text x="240.0" y="142.5" font-size="11" fill="#555" text-anchor="middle">2. sent after</text>
<path d="M560,95 L660,95" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="616.0" y="89.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">3. interceptor reads</text>
<text x="616.0" y="89.0" font-size="11" fill="#b8650a" text-anchor="middle">3. interceptor reads</text>
<path d="M755,120 L755,150" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="761.0" y="129.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">4. allowed through</text>
<text x="761.0" y="129.0" font-size="11" fill="#555" text-anchor="middle">4. allowed through</text>
<path d="M560,175 L660,175" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="616.0" y="169.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">message decoded</text>
<text x="616.0" y="169.0" font-size="11" fill="#555" text-anchor="middle">message decoded</text>
<text x="450" y="20" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">Headers travel ahead of the message; the interceptor never waits for the body.</text>
<text x="50" y="270" font-size="13" fill="#1d1d1d" text-anchor="start">authorization is one HPACK header among several (method, path, grpc-timeout); HTTP/2&#x27;s</text>
<text x="50" y="288" font-size="13" fill="#1d1d1d" text-anchor="start">static/dynamic tables compress repeat header names across calls on the same connection.</text>
</svg>