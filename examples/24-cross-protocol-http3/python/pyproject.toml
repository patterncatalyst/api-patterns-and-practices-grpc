[project]
name = "shipping-python-ch24-cross-protocol-http3"
version = "1.0.0"
description = "Ch24 cross-protocol-http3 — gRPC RoutingService.GetQuote (Python side, lean), plus an aioquic HTTP/3-over-QUIC transport probe against the chapter's Caddy service."
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.83,<2",
    "grpcio-reflection>=1.83,<2",
    "protobuf>=6.33.5,<8",
    # aioquic: the HTTP/3-over-QUIC transport probe's only dependency. Pin
    # matches the current PyPI release (checked against
    # https://pypi.org/pypi/aioquic/json at authoring time). This is a
    # transport probe — see app/h3_probe.py — never a gRPC transport; neither
    # grpcio nor grpc-java speaks gRPC-over-HTTP/3 as of this writing.
    "aioquic>=1.6.1,<2",
]

# grpcio-tools is build-time only (generates stubs from contracts/proto/ —
# see Containerfile); the runtime image never needs it.
[dependency-groups]
dev = [
    "grpcio-tools>=1.83,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
