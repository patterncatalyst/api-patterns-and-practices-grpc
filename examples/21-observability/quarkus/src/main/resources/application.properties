# Ch21 observability ANCHOR — Quarkus, one process, two gRPC services PLUS
# a REST front door.
#
# gRPC server: its own port, separate from the HTTP server (the default
# quarkus-grpc topology — quarkus.grpc.server.use-separate-server is NOT set
# to false here, so REST and gRPC keep independent ports exactly like every
# prior chapter). Container port 9000, mapped to host 9210 by compose.yaml.
# BOTH RoutingServiceImpl and QuoteServiceImpl are @GrpcService beans
# registered on this one server, and so is the built-in grpc.health.v1.Health
# service — quarkus-grpc registers Health automatically for every
# @GrpcService bean present, no separate dependency or enable flag.
quarkus.grpc.server.port=9000
quarkus.grpc.server.host=0.0.0.0

# Server reflection is on by default in dev mode only; verify.sh drives this
# over grpcurl's reflection client in every mode (including the packaged
# container), so it must be explicit here.
quarkus.grpc.server.enable-reflection-service=true

# Two named @GrpcClient configs, both loopbacks to this same process's own
# gRPC port: "quote" is RoutingServiceImpl's downstream call to
# QuoteServiceImpl (the Ch10 hop), and "routing" is BookingResource's call
# INTO RoutingServiceImpl from the REST layer. Two config names because
# quarkus-grpc binds one stub type per @GrpcClient name, not because the
# target differs — both resolve to localhost:9000.
quarkus.grpc.clients.quote.host=localhost
quarkus.grpc.clients.quote.port=9000
quarkus.grpc.clients.routing.host=localhost
quarkus.grpc.clients.routing.port=9000

# The HTTP server BookingResource's POST /booking/quote listens on. Bound to
# 0.0.0.0 so it's reachable from outside the container; mapped to host 8210
# by compose.yaml. quarkus-micrometer-registry-prometheus also publishes
# /q/metrics on this same port.
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# OTLP endpoint for the ALWAYS-ON lgtm service (not opt-in in this chapter —
# see compose.yaml). Falls back to the OTel SDK default
# (http://localhost:4317) when OTEL_EXPORTER_OTLP_ENDPOINT is unset, which
# simply fails to export (logged, non-fatal) when no collector is listening —
# the service starts and serves GetQuote/booking.quote either way.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=ch21-observability-quarkus
