# Ch23 grpc-web & JSON/HTTP transcoding — Quarkus, one process, two gRPC
# services PLUS a REST front door. Identical topology to Ch21; the only new
# thing in this chapter is the Envoy sidecar in front of this server
# (../envoy/), not this server itself.

# gRPC server: its own port, separate from the HTTP server. Container port
# 9000, mapped to host 9230 by compose.yaml; Envoy's "app" cluster
# (../envoy/envoy-quarkus.yaml) also dials this same port, by its in-network
# name "quarkus:9000". Both RoutingServiceImpl and QuoteServiceImpl are
# @GrpcService beans registered on this one server.
quarkus.grpc.server.port=9000
quarkus.grpc.server.host=0.0.0.0

# Server reflection is what grpcurl's reflection client (lib.sh's grpc_call,
# used for the NATIVE gRPC assertion) needs. It has nothing to do with Envoy's
# transcoder/grpc-web filters, which resolve shipping.routing.v1.RoutingService
# from the baked-in FileDescriptorSet built at Envoy image build time
# (../envoy/Containerfile), not from this server's reflection service.
quarkus.grpc.server.enable-reflection-service=true

# Two named @GrpcClient configs, both loopbacks to this same process's own
# gRPC port: "quote" is RoutingServiceImpl's downstream call to
# QuoteServiceImpl, and "routing" is BookingResource's call INTO
# RoutingServiceImpl from the REST layer (the hand-written shim this chapter
# contrasts against Envoy's generic transcoder).
quarkus.grpc.clients.quote.host=localhost
quarkus.grpc.clients.quote.port=9000
quarkus.grpc.clients.routing.host=localhost
quarkus.grpc.clients.routing.port=9000

# The HTTP server BookingResource's POST /booking/quote listens on. Bound to
# 0.0.0.0 so it's reachable from outside the container; mapped to host 8230
# by compose.yaml.
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# Opt-in observability only — ../compose.yaml's `observability` profile. Falls
# back to the OTel SDK default (http://localhost:4317) when
# OTEL_EXPORTER_OTLP_ENDPOINT is unset, which simply fails to export (logged,
# non-fatal) when no collector is listening — the service starts and serves
# GetQuote/booking.quote either way.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=ch23-grpc-web-quarkus
