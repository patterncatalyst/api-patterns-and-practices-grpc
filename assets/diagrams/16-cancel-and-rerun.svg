<path d="M190,495 L250,510" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="226.0" y="496.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">RecomputeRoutes #2</text>
