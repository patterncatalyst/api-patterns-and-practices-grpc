# Ch18 performance-tuning — Quarkus RoutingService.
#
# gRPC server: listens on its own port (NOT the HTTP port), bound to 0.0.0.0
# so it is reachable from outside the container. Container port 9000, mapped
# to host 9180 by compose.yaml.
quarkus.grpc.server.port=9000
quarkus.grpc.server.host=0.0.0.0

# Server reflection is on by default in dev mode only; verify.sh drives this
# over grpcurl's reflection client in every mode (including the packaged
# container), so it must be explicit here.
quarkus.grpc.server.enable-reflection-service=true

# ── This chapter's tuning levers ────────────────────────────────────────────
#
# 1. max-inbound-message-size: with quarkus.grpc.server.use-separate-server
#    left at its default (true), quarkus-grpc's own default inbound cap is
#    4MB — the same 4MB a grpcurl/grpc-go client enforces on what it will
#    RECEIVE. Raised here to 16MB so a large INCOMING request (not just this
#    chapter's large ListRoutes response) has headroom too. Verified against
#    the quarkus-grpc 3.40.1 config model (see README.md) rather than assumed
#    from memory — the javadoc for this key spells out the 4MB-vs-256KB split
#    between separate-server and unified-server mode explicitly.
quarkus.grpc.server.max-inbound-message-size=16777216

# 2. Keepalive: ping an otherwise-idle HTTP/2 connection so a silent
#    intermediary (a load balancer, a NAT device) doesn't drop it out from
#    under a long-lived channel. permit-keep-alive-time is the floor on how
#    often the SERVER will tolerate a CLIENT-initiated ping without data —
#    below it, the server treats the client as abusive and can tear the
#    connection down. 5s here (a production value is typically tens of
#    seconds to a few minutes) only so keepalive_client.py can exercise a
#    real idle gap inside a verify.sh run without a slow test.
quarkus.grpc.server.netty.keep-alive-time=5s
quarkus.grpc.server.netty.permit-keep-alive-time=5s
quarkus.grpc.server.netty.permit-keep-alive-without-calls=true

# 3. gzip compression for every response this server sends. A clear win for
#    ListRoutes' padded, highly repetitive payload; close to a wash — all
#    cost, no size win — for GetQuote's few dozen bytes. Forced server-wide
#    here because this example's dominant payload is ListRoutes' large page;
#    see "Decision" in the chapter for when to gate this per call instead.
quarkus.grpc.server.compression=gzip

# OTLP endpoint for the opt-in `observability` compose profile. Falls back to
# the OTel SDK default (http://localhost:4317) when OTEL_EXPORTER_OTLP_ENDPOINT
# is unset, which simply fails to export (logged, non-fatal) when no
# collector is listening — the service starts and serves either RPC either way.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=ch18-routing-quarkus
