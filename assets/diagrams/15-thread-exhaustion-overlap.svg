<text x="476.0" y="179.0" font-size="11" fill="#555" text-anchor="middle">elapsed ~3.2s</text>
<path d="M40,510 L160,510" fill="none" stroke="#b8650a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="106.0" y="504.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">elapsed ~0.45s</text>
<text x="106.0" y="504.0" font-size="11" fill="#b8650a" text-anchor="middle">elapsed ~0.45s</text>
<text x="40" y="48" font-size="12" fill="#1d1d1d" text-anchor="start" font-weight="700">Same 8 concurrent FindOptimalRoute calls, same ~400ms of blocking I/O each:</text>
<text x="470" y="550" font-size="12" fill="#1d1d1d" text-anchor="middle">The work never gets cheaper; only where it runs decides whether 8 callers wait in line or finish together.</text>
