<path d="M1210,360 L1210,390" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="700" y="605" font-size="12" fill="#555555" text-anchor="middle">Same GetQuote call, same generated stub class on Python: the channel object decides blocking vs. async, not the code.</text>
