<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="30" width="860" height="240" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="50" font-size="12" font-weight="700" fill="#1d1d1d">RoutingService tuning knobs (this chapter)</text>
<rect x="50" y="80" width="190" height="160" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="145.0" y="135.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Keepalive</text>
<text x="145.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">Idle connection</text>
<text x="145.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">stays alive</text>
<text x="145.0" y="182.5" font-size="11.5" fill="#555555" text-anchor="middle">Cost:</text>
<text x="145.0" y="197.5" font-size="11.5" fill="#555555" text-anchor="middle">periodic ping traffic</text>
<rect x="260" y="80" width="190" height="160" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="355.0" y="135.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Max message size</text>
<text x="355.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">Large payloads</text>
<text x="355.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">allowed through</text>
<text x="355.0" y="182.5" font-size="11.5" fill="#555555" text-anchor="middle">Cost:</text>
<text x="355.0" y="197.5" font-size="11.5" fill="#555555" text-anchor="middle">raise BOTH ends</text>
<rect x="470" y="80" width="190" height="160" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="565.0" y="135.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Gzip compression</text>
<text x="565.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">Smaller payload</text>
<text x="565.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">on the wire</text>
<text x="565.0" y="182.5" font-size="11.5" fill="#555555" text-anchor="middle">Cost:</text>
<text x="565.0" y="197.5" font-size="11.5" fill="#555555" text-anchor="middle">CPU per call</text>
<rect x="680" y="80" width="160" height="160" rx="9" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
<text x="760.0" y="135.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Channel pooling</text>
<text x="760.0" y="152.5" font-size="11.5" fill="#dddddd" text-anchor="middle">Reuse, never</text>
<text x="760.0" y="167.5" font-size="11.5" fill="#dddddd" text-anchor="middle">reconnect</text>
<text x="760.0" y="182.5" font-size="11.5" fill="#dddddd" text-anchor="middle">Cost:</text>
<text x="760.0" y="197.5" font-size="11.5" fill="#dddddd" text-anchor="middle">none - always do this</text>
</svg>