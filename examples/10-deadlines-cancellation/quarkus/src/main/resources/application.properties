# Ch10 deadline-propagation ANCHOR — Quarkus, one process, two gRPC services.
#
# gRPC server: listens on its own port (NOT the HTTP port), bound to 0.0.0.0
# so it is reachable from outside the container. Container port 9000, mapped
# to host 9100 by compose.yaml. BOTH RoutingServiceImpl and QuoteServiceImpl
# are @GrpcService beans registered on this one server.
quarkus.grpc.server.port=9000
quarkus.grpc.server.host=0.0.0.0

# Server reflection is on by default in dev mode only; verify.sh drives this
# over grpcurl's reflection client in every mode (including the packaged
# container), so it must be explicit here.
quarkus.grpc.server.enable-reflection-service=true

# The @GrpcClient("quote") channel RoutingServiceImpl calls downstream — a
# LOOPBACK to this same process's own server port. This is the real gRPC hop
# the chapter is about: a deadline set on the inbound GetQuote call has to
# survive crossing this boundary, even though both ends happen to live in one
# container. No `quarkus.grpc.clients.quote.deadline` is set here — that
# property is a fixed per-client duration applied to every call regardless of
# how much budget the caller actually has left, which is the opposite of
# propagation. RoutingServiceImpl instead computes the remaining budget from
# the inbound call's own io.grpc.Context deadline and sets it explicitly per
# call via MutinyQuoteServiceStub#withDeadlineAfter (see RoutingServiceImpl).
quarkus.grpc.clients.quote.host=localhost
quarkus.grpc.clients.quote.port=9000

# OTLP endpoint for the opt-in `observability` compose profile. Falls back to
# the OTel SDK default (http://localhost:4317) when OTEL_EXPORTER_OTLP_ENDPOINT
# is unset, which simply fails to export (logged, non-fatal) when no
# collector is listening — the service starts and serves GetQuote either way.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=ch10-deadlines-quarkus
