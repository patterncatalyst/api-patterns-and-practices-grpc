[project]
name = "shipping-python-ch19-tls-mtls"
version = "1.0.0"
description = "Ch19 tls-mtls — gRPC RoutingService.GetQuote served over TLS/mTLS (Python side)."
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.75,<2",
    "grpcio-reflection>=1.75,<2",
    "protobuf>=5,<7",
]

# grpcio-tools is build-time only (generates stubs from contracts/proto/ —
# see Containerfile); the runtime image never needs it.
[dependency-groups]
dev = [
    "grpcio-tools>=1.75,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
