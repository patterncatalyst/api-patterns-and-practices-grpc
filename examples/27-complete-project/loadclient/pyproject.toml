[project]
name = "shipping-python-ch27-mesh"
version = "1.0.0"
description = "Final Project minikube subtree — a plaintext RoutingService/QuoteService/TrackingService mesh server (x-served-by trailer, x-trace-id propagation) plus loadclient.py, a single-channel tally client (Chapter 22 shape)."
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.75,<2",
    "grpcio-reflection>=1.75,<2",
    "grpcio-health-checking>=1.75,<2",
    "protobuf>=5,<7",
]

# grpcio-tools is build-time only (generates stubs from contracts/proto/ —
# see Containerfile); the runtime image never needs it.
[dependency-groups]
dev = [
    "grpcio-tools>=1.75,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
