<rect x="20" y="50" width="860" height="90" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="70" font-size="12" font-weight="700" fill="#1d1d1d">UNIMPLEMENTED</text>
<rect x="20" y="162" width="860" height="90" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="182" font-size="12" font-weight="700" fill="#1d1d1d">DEADLINE_EXCEEDED</text>
