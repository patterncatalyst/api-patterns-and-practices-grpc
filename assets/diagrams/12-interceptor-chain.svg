<text x="20" y="30" font-size="11" fill="#1d1d1d" text-anchor="start" font-weight="700">Server-side interceptor chain — registration order: global interceptors before service-specific ones</text>
<text x="20" y="225" font-size="11" fill="#1d1d1d" text-anchor="start">Quarkus: the ServerCall itself is wrapped (ForwardingServerCall) so close(status, trailers) logs whatever status the handler actually closes with.</text>
<text x="20" y="242" font-size="11" fill="#1d1d1d" text-anchor="start">Python: the resolved RpcMethodHandler&#x27;s behavior function is wrapped the same way — cardinality-matched so NegotiateRoute&#x27;s bidi stream works too.</text>
<text x="20" y="268" font-size="11" fill="#1d1d1d" text-anchor="start">Same auth hook gates GetQuote (implemented) and the four UNIMPLEMENTED RoutingService methods alike — the interceptor doesn&#x27;t know or care which handler is behind it.</text>
