[project]
name = "shipping-python-ch22-mesh-lb"
version = "1.0.0"
description = "Ch22 mesh-loadbalancing — gRPC RoutingService.GetQuote server (x-served-by trailer) + loadclient.py, a single-channel tally client."
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.75,<2",
    "grpcio-reflection>=1.75,<2",
    "protobuf>=5,<7",
]

# grpcio-tools is build-time only (generates stubs from contracts/proto/ —
# see Containerfile); the runtime image never needs it.
[dependency-groups]
dev = [
    "grpcio-tools>=1.75,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
