# Ch24 cross-protocol-http3 — compose topology for a lean
# shipping.routing.v1.RoutingService.GetQuote server on both stacks, a
# pinned `ghz` one-shot for a measured h2 (native gRPC) baseline, and a
# pinned Caddy serving one static JSON file over HTTPS as a separate,
# unrelated HTTP/3-over-QUIC transport probe target.
#
# The reason these stay separate: grpc-java and grpcio have no native
# gRPC-over-HTTP/3 transport as of this writing. So:
#   - `quarkus`/`python` speak gRPC the only way either stack can: native
#     gRPC over HTTP/2. verify.sh's grpcurl + ghz checks against them are a
#     hard, CI-gating correctness + measured-baseline check.
#   - `caddy` has nothing to do with either RoutingService. It serves a
#     static JSON file over HTTPS, and Caddy turns HTTP/3 on by default for
#     any TLS site — giving app/h3_probe.py (aioquic) something real to
#     complete a QUIC handshake and an HTTP/3 request against. This is the
#     transport, demonstrated in isolation — never a stand-in for
#     gRPC-over-HTTP/3, and verify.sh treats its result as capability-gated
#     and non-fatal (see run_h3_probe there).
#
# The build context for both app services is the REPO ROOT so each
# Containerfile can COPY the two proto files it needs straight from
# contracts/ — see quarkus/Containerfile and python/Containerfile.
#
# Usage:
#   docker compose up --build                                   # both apps + caddy
#   docker compose run --rm ghz --insecure \
#     --proto /contracts/shipping/routing/v1/routing.proto \
#     --import-paths /contracts \
#     --call shipping.routing.v1.RoutingService.GetQuote \
#     -d '{}' -c 10 -n 300 -O json quarkus:9000
#   docker compose run --rm --entrypoint python python \
#     -m app.h3_probe caddy 8443 --path /transport.json

services:
  quarkus:
    build:
      context: ../..
      dockerfile: examples/24-cross-protocol-http3/quarkus/Containerfile
    container_name: ch24-routing-quarkus
    ports:
      - "9240:9000"

  python:
    build:
      context: ../..
      dockerfile: examples/24-cross-protocol-http3/python/Containerfile
    container_name: ch24-routing-python
    ports:
      - "9241:9000"

  # ─── ghz load generator (one-shot; `docker compose run`, never `up`) ───────
  # Same pinned image and invocation pattern as Ch18's — profiled off so a
  # plain `docker compose up` never starts it; `docker compose run --rm ghz
  # ...` auto-enables a service's own profile. contracts/proto/ is mounted
  # read-only so ghz can be fed the .proto directly — ghz has no server
  # reflection support, unlike grpcurl.
  #
  # Image pin: ghcr.io/bojand/ghz 0.121.0 (latest stable at authoring time;
  # bojand/ghz is NOT published to docker.io, only to ghcr.io — verified with
  # `skopeo list-tags docker://ghcr.io/bojand/ghz`). Re-check the same way
  # before bumping.
  ghz:
    image: ghcr.io/bojand/ghz:0.121.0
    profiles: ["ghz"]
    volumes:
      - ../../contracts/proto:/contracts:ro

  # ─── Caddy: a static JSON file over HTTPS, HTTP/3 on by default ───────────
  # Not a gRPC endpoint, not a proxy to quarkus/python. Exists solely so
  # app/h3_probe.py (aioquic) has a real HTTP/3-over-QUIC target. Published
  # on both TCP (HTTP/1.1 and HTTP/2 fallback) and UDP (QUIC/HTTP-3) 8443, so
  # a reader can also point a browser or `curl --http3` at it from the host.
  #
  # Image pin: docker.io/library/caddy 2.11.7 (latest stable at authoring
  # time, verified with `skopeo list-tags docker://docker.io/library/caddy`).
  # Re-check the same way before bumping.
  caddy:
    image: docker.io/library/caddy:2.11.7
    container_name: ch24-caddy-h3
    ports:
      - "8443:8443"
      - "8443:8443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/www:/srv/www:ro
