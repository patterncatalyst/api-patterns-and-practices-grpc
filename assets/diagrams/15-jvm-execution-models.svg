<text x="652" y="115" font-size="12" font-weight="700" fill="#1d1d1d">@RunOnVirtualThread</text>
<rect x="370" y="20" width="200" height="55" rx="9" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
<text x="470.0" y="45.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">FindOptimalRoute</text>
<text x="470.0" y="62.5" font-size="11.5" fill="#dddddd" text-anchor="middle">(gRPC call arrives)</text>
<rect x="45" y="130" width="230" height="55" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="160.0" y="155.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Vert.x event loop</text>
<text x="160.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">(shared, few threads)</text>
<rect x="45" y="210" width="230" height="50" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="160.0" y="233.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">method body runs HERE,</text>
<text x="160.0" y="250.0" font-size="11.5" fill="#555555" text-anchor="middle">same thread as the dispatch</text>
<rect x="45" y="290" width="230" height="150" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="160.0" y="333.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">STARVING contrast</text>
<text x="160.0" y="350.0" font-size="11.5" fill="#555555" text-anchor="middle">(this chapter&#x27;s demo flag)</text>
<text x="160.0" y="365.0" font-size="11.5" fill="#555555" text-anchor="middle">blocking I/O called directly -&gt;</text>
<text x="160.0" y="380.0" font-size="11.5" fill="#555555" text-anchor="middle">occupies the loop for ~400ms;</text>
<text x="160.0" y="395.0" font-size="11.5" fill="#555555" text-anchor="middle">every other call on this</text>
<text x="160.0" y="410.0" font-size="11.5" fill="#555555" text-anchor="middle">SAME loop queues behind it</text>
<rect x="355" y="130" width="230" height="55" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="470.0" y="155.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">@Blocking</text>
<text x="470.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">(this example&#x27;s correct model)</text>
<rect x="355" y="210" width="230" height="50" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="470.0" y="233.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Vert.x worker pool</text>
<text x="470.0" y="250.0" font-size="11.5" fill="#555555" text-anchor="middle">(default ~20 threads)</text>
<rect x="355" y="290" width="230" height="150" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="470.0" y="340.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">blocking I/O runs on a</text>
<text x="470.0" y="357.5" font-size="11.5" fill="#555555" text-anchor="middle">worker thread, not the loop;</text>
<text x="470.0" y="372.5" font-size="11.5" fill="#555555" text-anchor="middle">8 concurrent calls use 8</text>
<text x="470.0" y="387.5" font-size="11.5" fill="#555555" text-anchor="middle">of ~20 threads and overlap</text>
<text x="470.0" y="402.5" font-size="11.5" fill="#555555" text-anchor="middle">(verify.sh: &lt; 2.5s for 8)</text>
<rect x="665" y="130" width="230" height="55" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="780.0" y="155.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">@RunOnVirtualThread</text>
<text x="780.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">(illustrative 3rd model)</text>
<rect x="665" y="210" width="230" height="50" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="780.0" y="233.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">fresh virtual thread</text>
<text x="780.0" y="250.0" font-size="11.5" fill="#555555" text-anchor="middle">started per call</text>
<rect x="665" y="290" width="230" height="150" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="780.0" y="340.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">cheap to block, millions</text>
<text x="780.0" y="357.5" font-size="11.5" fill="#555555" text-anchor="middle">possible -- BUT: pinning on</text>
<text x="780.0" y="372.5" font-size="11.5" fill="#555555" text-anchor="middle">native-code calls, and</text>
<text x="780.0" y="387.5" font-size="11.5" fill="#555555" text-anchor="middle">ThreadLocal-heavy libraries</text>
<text x="780.0" y="402.5" font-size="11.5" fill="#555555" text-anchor="middle">allocate per call, not pooled</text>
