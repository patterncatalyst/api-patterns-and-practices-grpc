<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="40" y="70" width="160" height="60" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="120.0" y="98.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Client</text>
<text x="120.0" y="115.0" font-size="11.5" fill="#555555" text-anchor="middle">instrumented stub</text>
<rect x="420" y="70" width="220" height="60" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="530.0" y="98.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">gRPC server</text>
<text x="530.0" y="115.0" font-size="11.5" fill="#555555" text-anchor="middle">extracts traceparent</text>
<rect x="420" y="190" width="220" height="50" rx="9" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
<text x="530.0" y="213.0" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Child span</text>
<text x="530.0" y="230.0" font-size="11.5" fill="#dddddd" text-anchor="middle">continues parent trace-id</text>
<path d="M200,90 L420,90" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="316.0" y="84.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">1 HEADERS: traceparent: 00-&lt;trace-id&gt;-&lt;span-id&gt;-01</text>
<text x="316.0" y="84.0" font-size="11" fill="#b8650a" text-anchor="middle">1 HEADERS: traceparent: 00-&lt;trace-id&gt;-&lt;span-id&gt;-01</text>
<path d="M200,120 L420,120" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="316.0" y="114.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">2 DATA (sent after): GetQuoteRequest bytes</text>
<text x="316.0" y="114.0" font-size="11" fill="#555" text-anchor="middle">2 DATA (sent after): GetQuoteRequest bytes</text>
<path d="M530,130 L530,190" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="536.0" y="154.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">extract -&gt; start child span</text>
<text x="536.0" y="154.0" font-size="11" fill="#555" text-anchor="middle">extract -&gt; start child span</text>
<text x="440" y="25" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">traceparent travels as an HPACK header on HEADERS, ahead of the DATA frame carrying the message</text>
<text x="530" y="270" font-size="11" fill="#1d1d1d" text-anchor="middle">Same trace-id, new span-id: what verify.sh&#x27;s log grep confirms</text>
</svg>