<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="36" width="920" height="190" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="56" font-size="12" font-weight="700" fill="#1d1d1d">Safe: every existing reader&#x27;s interpretation of every existing field number is unchanged</text>
<rect x="20" y="250" width="920" height="190" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="270" font-size="12" font-weight="700" fill="#1d1d1d">Breaking: an old reader misreads new bytes, or a reader&#x27;s bytes stop arriving</text>
<rect x="40" y="76" width="200" height="90" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="140.0" y="111.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">rename field</text>
<text x="140.0" y="128.5" font-size="11.5" fill="#555555" text-anchor="middle">origin_un_locode -&gt; origin</text>
<text x="140.0" y="143.5" font-size="11.5" fill="#555555" text-anchor="middle">number 1: unchanged</text>
<rect x="260" y="76" width="200" height="90" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="360.0" y="111.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">add field</text>
<text x="360.0" y="128.5" font-size="11.5" fill="#555555" text-anchor="middle">cargo_count = 5</text>
<text x="360.0" y="143.5" font-size="11.5" fill="#555555" text-anchor="middle">unused number</text>
<rect x="480" y="76" width="200" height="90" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="580.0" y="111.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">add RPC</text>
<text x="580.0" y="128.5" font-size="11.5" fill="#555555" text-anchor="middle">ListRoutes</text>
<text x="580.0" y="143.5" font-size="11.5" fill="#555555" text-anchor="middle">old stub never calls it</text>
<rect x="700" y="76" width="200" height="90" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="800.0" y="111.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">widen numeric type</text>
<text x="800.0" y="128.5" font-size="11.5" fill="#555555" text-anchor="middle">int32 -&gt; int64</text>
<text x="800.0" y="143.5" font-size="11.5" fill="#555555" text-anchor="middle">same wire type: varint</text>
<rect x="40" y="290" width="200" height="90" rx="9" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
<text x="140.0" y="325.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">renumber field</text>
<text x="140.0" y="342.5" font-size="11.5" fill="#dddddd" text-anchor="middle">field 1 -&gt; field 6</text>
<text x="140.0" y="357.5" font-size="11.5" fill="#dddddd" text-anchor="middle">old binary still sends 1</text>
<rect x="260" y="290" width="200" height="90" rx="9" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
<text x="360.0" y="325.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">reuse number</text>
<text x="360.0" y="342.5" font-size="11.5" fill="#dddddd" text-anchor="middle">new field, same number</text>
<text x="360.0" y="357.5" font-size="11.5" fill="#dddddd" text-anchor="middle">wrong type read silently</text>
<rect x="480" y="290" width="200" height="90" rx="9" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
<text x="580.0" y="325.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">change field type</text>
<text x="580.0" y="342.5" font-size="11.5" fill="#dddddd" text-anchor="middle">double -&gt; string</text>
<text x="580.0" y="357.5" font-size="11.5" fill="#dddddd" text-anchor="middle">different wire type</text>
<rect x="700" y="290" width="200" height="90" rx="9" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
<text x="800.0" y="325.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">remove field</text>
<text x="800.0" y="342.5" font-size="11.5" fill="#dddddd" text-anchor="middle">reader still depends on it</text>
<text x="800.0" y="357.5" font-size="11.5" fill="#dddddd" text-anchor="middle">bytes simply stop arriving</text>
<path d="M140,166 L140,290" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="146.0" y="222.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">field number: unchanged vs moved</text>
<text x="146.0" y="222.0" font-size="11" fill="#555" text-anchor="middle">field number: unchanged vs moved</text>
<text x="480" y="465" font-size="12" fill="#1d1d1d" text-anchor="middle">The field number is the contract; it can never move once a message has shipped. The name is for humans only.</text>
</svg>