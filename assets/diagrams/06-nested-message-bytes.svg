<text x="68" y="293" font-size="11.5" fill="#1d1d1d" text-anchor="middle">outer key</text>
<text x="128" y="293" font-size="11.5" fill="#1d1d1d" text-anchor="middle">outer len=14</text>
<text x="578" y="293" font-size="11.5" fill="#1d1d1d" text-anchor="middle">nested Money: 14 bytes (identical to Ch. 3&#x27;s standalone decode)</text>
<text x="1028" y="293" font-size="11.5" fill="#1d1d1d" text-anchor="middle">outer key (route)</text>
<text x="44" y="420" font-size="12.5" fill="#1d1d1d" text-anchor="start" font-weight="700">key byte = (field_number &lt;&lt; 3) | wire_type: the same formula at every nesting depth</text>
<text x="44" y="442" font-size="12" fill="#555555" text-anchor="start">0x0A = (1&lt;&lt;3)|2 -&gt; field 1, LEN     0x0E = length 14     0x12 = (2&lt;&lt;3)|2 -&gt; field 2, LEN (reused, shallower)</text>
<text x="44" y="530" font-size="12.5" fill="#1d1d1d" text-anchor="start">A nested message costs exactly one extra key byte + one length byte beyond its own contents: nothing more.</text>
<text x="44" y="554" font-size="12.5" fill="#1d1d1d" text-anchor="start">Money&#x27;s field-1 key (0x0A) repeats unchanged one level down: a key encodes (field #, wire type), never tree position.</text>
<text x="44" y="578" font-size="12.5" fill="#1d1d1d" text-anchor="start">A parser never tracks depth: read a key, dispatch on wire type, recurse into LEN when the schema says “message.”</text>
