# Ch27 final project — Quarkus: RoutingService, QuoteService, TrackingService
# and grpc.health.v1.Health all on ONE gRPC server, behind mTLS (Ch19) and a
# JWT + per-method-scope interceptor (Ch20), with a REST front door and OTel
# tracing/metrics (Ch21) layered on top.

# ── gRPC server ──────────────────────────────────────────────────────────────
# Its own port, separate from the HTTP server. Container port 9000, mapped to
# host 9270 by compose.yaml.
quarkus.grpc.server.port=9000
quarkus.grpc.server.host=0.0.0.0
quarkus.grpc.server.enable-reflection-service=true

# ── mTLS (Ch19 shape, unchanged) ─────────────────────────────────────────────
# This is the gRPC Java server (quarkus.grpc.server.use-separate-server
# defaults to true), so TLS is configured under quarkus.grpc.server.ssl.*.
quarkus.grpc.server.plain-text=false
quarkus.grpc.server.ssl.certificate=/certs/server.crt
quarkus.grpc.server.ssl.key=/certs/server.key
quarkus.grpc.server.ssl.trust-store=/certs/ca-truststore.jks
quarkus.grpc.server.ssl.trust-store-password=changeit
# REQUIRED is this example's steady state: every external grpcurl/ghz call,
# and every internal loopback call this process makes to itself (Booking ->
# Routing, Routing -> Quote — see security/SecureGrpcClients.java), must
# present the client certificate certgen mints.
quarkus.grpc.server.ssl.client-auth=REQUIRED

# ── REST front door ──────────────────────────────────────────────────────────
# POST /booking/quote. Bound to 0.0.0.0; mapped to host 8270 by compose.yaml.
# quarkus-micrometer-registry-prometheus also publishes /q/metrics here.
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# ── OTel (Ch21 shape) ────────────────────────────────────────────────────────
# Always-on lgtm service for this chapter — see compose.yaml. Falls back to
# the SDK default (http://localhost:4317) when unset, which simply fails to
# export (logged, non-fatal) if nothing is listening there.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=ch27-final-project-quarkus
