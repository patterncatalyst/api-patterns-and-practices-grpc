<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="190" width="430" height="190" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="210" font-size="12" font-weight="700" fill="#1d1d1d">I/O-bound (time.sleep, file/socket read)</text>
<rect x="470" y="190" width="450" height="190" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="482" y="210" font-size="12" font-weight="700" fill="#1d1d1d">CPU-bound (pure Python loop, no I/O)</text>
<rect x="40" y="20" width="260" height="55" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="170.0" y="45.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">grpc.aio event loop</text>
<text x="170.0" y="62.5" font-size="11.5" fill="#555555" text-anchor="middle">(single asyncio thread)</text>
<rect x="40" y="95" width="260" height="50" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="170.0" y="118.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">await asyncio.to_thread(...)</text>
<text x="170.0" y="135.0" font-size="11.5" fill="#555555" text-anchor="middle">(this chapter&#x27;s correct model)</text>
<rect x="640" y="20" width="260" height="55" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="770.0" y="45.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">default ThreadPoolExecutor</text>
<text x="770.0" y="62.5" font-size="11.5" fill="#555555" text-anchor="middle">(min(32, cpu+4) workers)</text>
<rect x="40" y="220" width="390" height="60" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="235.0" y="248.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">GIL released for the call&#x27;s duration</text>
<text x="235.0" y="265.0" font-size="11.5" fill="#555555" text-anchor="middle">(CPython has always done this for I/O)</text>
<rect x="40" y="300" width="390" height="65" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="235.0" y="323.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">8 concurrent offloaded calls genuinely</text>
<text x="235.0" y="340.0" font-size="11.5" fill="#555555" text-anchor="middle">OVERLAP -- each thread blocks on its</text>
<text x="235.0" y="355.0" font-size="11.5" fill="#555555" text-anchor="middle">own I/O, GIL is free the whole time</text>
<rect x="490" y="220" width="410" height="60" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="695.0" y="248.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">GIL held for the whole call</text>
<text x="695.0" y="265.0" font-size="11.5" fill="#555555" text-anchor="middle">(no bytecode-level release point)</text>
<rect x="490" y="300" width="410" height="65" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="695.0" y="323.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">8 concurrent CPU-bound calls SERIALIZE</text>
<text x="695.0" y="340.0" font-size="11.5" fill="#555555" text-anchor="middle">on the GIL regardless of thread count --</text>
<text x="695.0" y="355.0" font-size="11.5" fill="#555555" text-anchor="middle">more threads does not mean more throughput</text>
<rect x="40" y="405" width="860" height="60" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="470.0" y="433.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">STARVING contrast (this chapter&#x27;s demo flag): calling blocking_lookup() in-line, with no await point, blocks</text>
<text x="470.0" y="450.0" font-size="11.5" fill="#555555" text-anchor="middle">THIS event loop exactly the way CPU-bound work blocks the GIL -- every other coroutine queues behind it.</text>
<path d="M170,75 L170,93" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M300,120 L638,48" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="475.0" y="78.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">dispatches to</text>
<text x="475.0" y="78.0" font-size="11" fill="#b8650a" text-anchor="middle">dispatches to</text>
<path d="M235,145 L235,188" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M760,75 L695,188" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="470" y="475" font-size="12" fill="#1d1d1d" text-anchor="middle">Free-threaded 3.14 (PEP 703) removes the GIL entirely -- but this project&#x27;s CI image is the standard (GIL) build; not measured here.</text>
</svg>