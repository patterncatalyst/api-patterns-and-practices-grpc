<text x="155.0" y="111.0" font-size="11.5" fill="#555555" text-anchor="middle">FindOptimalRoute call fails</text>
<rect x="335" y="68" width="230" height="56" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="450.0" y="94.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Method never wired</text>
<text x="450.0" y="111.0" font-size="11.5" fill="#555555" text-anchor="middle">declared in the .proto, no server code</text>
<rect x="630" y="68" width="230" height="56" rx="9" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
<text x="745.0" y="94.0" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Implement it, or route elsewhere</text>
<text x="745.0" y="111.0" font-size="11.5" fill="#dddddd" text-anchor="middle">check reflection describe first</text>
<rect x="40" y="180" width="230" height="56" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="155.0" y="206.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">DEADLINE_EXCEEDED</text>
<text x="155.0" y="223.0" font-size="11.5" fill="#555555" text-anchor="middle">GetQuote call fails</text>
<rect x="335" y="180" width="230" height="56" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="450.0" y="206.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Budget &lt; work</text>
<text x="450.0" y="223.0" font-size="11.5" fill="#555555" text-anchor="middle">1s client deadline, ~2s server delay</text>
<rect x="630" y="180" width="230" height="56" rx="9" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
<text x="745.0" y="206.0" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Raise the deadline or the budget</text>
<text x="745.0" y="223.0" font-size="11.5" fill="#dddddd" text-anchor="middle">or speed up the slow path</text>
<rect x="40" y="292" width="230" height="56" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="155.0" y="318.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">UNAVAILABLE</text>
<text x="155.0" y="335.0" font-size="11.5" fill="#555555" text-anchor="middle">RPC fails, no response</text>
<rect x="335" y="292" width="230" height="56" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="450.0" y="318.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Cold or closed channel</text>
<text x="450.0" y="335.0" font-size="11.5" fill="#555555" text-anchor="middle">nothing listening at the target</text>
<rect x="630" y="292" width="230" height="56" rx="9" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
<text x="745.0" y="318.0" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Fix the target address</text>
<text x="745.0" y="335.0" font-size="11.5" fill="#dddddd" text-anchor="middle">or wait for the server to start</text>
<rect x="40" y="404" width="230" height="56" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="155.0" y="430.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Dial fails, no status code</text>
<text x="155.0" y="447.0" font-size="11.5" fill="#555555" text-anchor="middle">&quot;Failed to dial target host&quot;</text>
<rect x="335" y="404" width="230" height="56" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="450.0" y="430.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">TLS client vs plaintext server</text>
<text x="450.0" y="447.0" font-size="11.5" fill="#555555" text-anchor="middle">(or the reverse)</text>
<rect x="630" y="404" width="230" height="56" rx="9" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
<text x="745.0" y="430.0" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Match -plaintext to the server</text>
<text x="745.0" y="447.0" font-size="11.5" fill="#dddddd" text-anchor="middle">add real TLS, not a flag flip</text>
