# Fix #1: a headless Service (clusterIP: None) has no virtual IP and no
# kube-proxy involvement at all — DNS for this name returns one A/AAAA
# record PER READY POD. A client that resolves this name with grpc-core's
# `dns:///` scheme and sets LB policy `round_robin` opens one subchannel
# (one persistent HTTP/2 connection) per pod and spreads RPCs across all of
# them. See Chapter 22's "Fix #1: headless Service + client-side round_robin".
apiVersion: v1
kind: Service
metadata:
  name: quote-headless
  labels:
    app: quote
spec:
  clusterIP: None
  selector:
    app: quote
  ports:
    - name: grpc
      port: 9000
      targetPort: 9000
