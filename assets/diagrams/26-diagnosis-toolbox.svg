<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="40" width="280" height="340" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="60" font-size="12" font-weight="700" fill="#1d1d1d">Reflection</text>
<rect x="320" y="40" width="280" height="340" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="332" y="60" font-size="12" font-weight="700" fill="#1d1d1d">channelz</text>
<rect x="620" y="40" width="280" height="340" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="632" y="60" font-size="12" font-weight="700" fill="#1d1d1d">GRPC_TRACE / GRPC_VERBOSITY</text>
<rect x="35" y="70" width="250" height="55" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="160.0" y="95.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Server reflection</text>
<text x="160.0" y="112.5" font-size="11.5" fill="#555555" text-anchor="middle">grpcurl list / describe</text>
<rect x="35" y="135" width="250" height="70" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="160.0" y="168.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Reveals</text>
<text x="160.0" y="185.0" font-size="11.5" fill="#555555" text-anchor="middle">services, methods, message shapes — no .proto needed</text>
<rect x="35" y="215" width="250" height="55" rx="9" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
<text x="160.0" y="240.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Quarkus: full support</text>
<text x="160.0" y="257.5" font-size="11.5" fill="#dddddd" text-anchor="middle">service + method + message describe</text>
<rect x="35" y="280" width="250" height="55" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5"/>
<text x="160.0" y="305.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Python: service/message only</text>
<text x="160.0" y="322.5" font-size="11.5" fill="#555555" text-anchor="middle">method-level describe: Symbol not found</text>
<rect x="335" y="70" width="250" height="55" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="460.0" y="95.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">channelz</text>
<text x="460.0" y="112.5" font-size="11.5" fill="#555555" text-anchor="middle">grpc.channelz.v1.Channelz/GetServers</text>
<rect x="335" y="135" width="250" height="70" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="460.0" y="168.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Reveals</text>
<text x="460.0" y="185.0" font-size="11.5" fill="#555555" text-anchor="middle">live servers, sockets, calls started/succeeded/failed</text>
<rect x="335" y="215" width="250" height="55" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="460.0" y="240.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Quarkus: no support</text>
<text x="460.0" y="257.5" font-size="11.5" fill="#555555" text-anchor="middle">absent from quarkus-grpc 3.40.x</text>
<rect x="335" y="280" width="250" height="55" rx="9" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
<text x="460.0" y="305.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Python: full support</text>
<text x="460.0" y="322.5" font-size="11.5" fill="#dddddd" text-anchor="middle">registered on the same port, same server</text>
<rect x="635" y="70" width="250" height="55" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="760.0" y="95.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">GRPC_TRACE / GRPC_VERBOSITY</text>
<text x="760.0" y="112.5" font-size="11.5" fill="#555555" text-anchor="middle">env vars read by the CALLING library</text>
<rect x="635" y="135" width="250" height="70" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="760.0" y="168.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Reveals</text>
<text x="760.0" y="185.0" font-size="11.5" fill="#555555" text-anchor="middle">C-core transport/call activity on stderr</text>
<rect x="635" y="215" width="250" height="55" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="760.0" y="240.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">grpcurl / grpc-go: silent</text>
<text x="760.0" y="257.5" font-size="11.5" fill="#555555" text-anchor="middle">use GRPC_GO_LOG_VERBOSITY_LEVEL instead</text>
<rect x="635" y="280" width="250" height="55" rx="9" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
<text x="760.0" y="305.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">grpc-python / C-core: verbose</text>
<text x="760.0" y="322.5" font-size="11.5" fill="#dddddd" text-anchor="middle">illustrative — exact lines vary by release</text>
</svg>