[project]
name = "shipping-python-ch11-errors"
version = "1.0.0"
description = "Ch11 error handling — gRPC RoutingService.GetQuote rich errors (Python side)."
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.83,<2",
    "grpcio-reflection>=1.83,<2",
    # grpcio-status requires protobuf>=6.33.5,<8 and grpcio>=1.83 — the floor
    # both constraints above match. It carries google.rpc.status_pb2 and
    # error_details_pb2 (ErrorInfo, BadRequest, RetryInfo): runtime library
    # classes, not generated from this chapter's .proto.
    "grpcio-status>=1.83,<2",
    "protobuf>=6.33.5,<8",
    "opentelemetry-distro>=0.50b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    "opentelemetry-instrumentation-grpc>=0.50b0",
]

# grpcio-tools is build-time only (generates stubs from contracts/proto/ —
# see Containerfile); the runtime image never needs it.
[dependency-groups]
dev = [
    "grpcio-tools>=1.83,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
