# Ch19 tls-mtls — Quarkus RoutingService, served over TLS/mTLS.
#
# gRPC server: listens on its own port (NOT the HTTP port), bound to 0.0.0.0
# so it is reachable from outside the container. Container port 9000, mapped
# to host 9190 by compose.yaml.
quarkus.grpc.server.port=9000
quarkus.grpc.server.host=0.0.0.0

# Server reflection is on by default in dev mode only; verify.sh drives this
# over grpcurl's reflection client in every mode (including the packaged
# container), so it must be explicit here. Reflection works the same way
# over a TLS/mTLS channel as it does plaintext — it's an ordinary unary RPC.
quarkus.grpc.server.enable-reflection-service=true

# ── TLS / mTLS (this chapter's subject) ─────────────────────────────────────
#
# This is the gRPC Java server (quarkus.grpc.server.use-separate-server
# defaults to true, unchanged from every prior chapter), so TLS is
# configured under quarkus.grpc.server.ssl.* — NOT quarkus.http.ssl.* or the
# quarkus.tls.<name>.* registry, which apply to the alternative Vert.x-based
# gRPC server (use-separate-server=false). Confirmed against the installed
# quarkus-grpc 3.40.1 reference guide's own "With the gRPC Java server" /
# "TLS with Mutual Auth" sections rather than assumed from memory — that
# guide states this server accepts PEM only for certificate/key, which
# certgen (see ../../certgen/) provides directly.
quarkus.grpc.server.plain-text=false
quarkus.grpc.server.ssl.certificate=/certs/server.crt
quarkus.grpc.server.ssl.key=/certs/server.key
# The trust-store is the CA client certificates must chain to; it is loaded
# unconditionally so a config change to client-auth below never needs a
# second file. With client-auth=NONE it is simply unused. Unlike certificate/
# key, this gRPC Java server's trust-store loads through Vert.x's
# KeyStoreHelper and rejects a plain PEM CA ("Invalid keystore format",
# confirmed empirically) — it needs an actual Java keystore. A PKCS12
# trust-store built by openssl's `pkcs12 -export -nokeys` doesn't satisfy
# this either: it loads with zero usable trust anchors under Java's PKIX
# validator, failing mTLS handshakes silently rather than cleanly. certgen
# (see ../../certgen/) uses `keytool -importcert` instead, which produces a
# trust-store Java recognizes correctly. The password is not a secret; a
# Java keystore always requires one to unlock the archive.
quarkus.grpc.server.ssl.trust-store=/certs/ca-truststore.jks
quarkus.grpc.server.ssl.trust-store-password=changeit
# NONE (no client cert requested) / REQUEST (asked for, not enforced) /
# REQUIRED (handshake fails without one) — the three-value enum this
# chapter's two phases exercise. GRPC_CLIENT_AUTH lets verify.sh switch this
# server between "TLS only" and "mTLS" without rebuilding the image; the
# default, REQUIRED, is this example's steady state.
quarkus.grpc.server.ssl.client-auth=${GRPC_CLIENT_AUTH:REQUIRED}
