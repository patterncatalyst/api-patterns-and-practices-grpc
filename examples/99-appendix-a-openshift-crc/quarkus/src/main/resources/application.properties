# Appendix A — OpenShift Local (CRC): shipping.quote.v1.QuoteService.GetQuote.
#
# Plaintext gRPC server: no quarkus.grpc.server.ssl.* here (compare Ch19/
# Ch27's app-level mTLS). On CRC this pod runs inside OpenShift Service
# Mesh 3; the STRICT PeerAuthentication in mesh/peer-authentication.yaml
# requires every OTHER meshed pod's sidecar to speak mTLS to this Service,
# and the sidecar — not this JVM — terminates it. grpcurl from outside the
# mesh reaches this same port in cleartext only through a Route (h2c/
# passthrough); a plaintext call to the Service name from an unmeshed pod
# is reset. See the chapter's "On the wire" box and "Decision" callout.
# The Quarkus application name drives the in-cluster BuildConfig/ImageStream
# name (quarkus-openshift); pin it to "getquote" to match the Helm chart's
# Deployment/Service names and values.yaml's image.repository, rather than
# letting it default to the Maven artifactId (appendix-a-getquote).
quarkus.application.name=getquote

quarkus.grpc.server.port=9000
quarkus.grpc.server.host=0.0.0.0
quarkus.grpc.server.plain-text=true
quarkus.grpc.server.enable-reflection-service=true

quarkus.http.host=0.0.0.0
quarkus.http.port=8080
