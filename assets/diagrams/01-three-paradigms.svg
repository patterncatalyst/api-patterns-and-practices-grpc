<text x="600.0" y="200.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Mental model</text>
<text x="600.0" y="217.5" font-size="11.5" fill="#555555" text-anchor="middle">Call a typed method</text>
<text x="600.0" y="232.5" font-size="11.5" fill="#555555" text-anchor="middle">behavior, not state</text>
<rect x="430" y="275" width="340" height="110" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="600.0" y="320.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">RoutingService.GetQuote(req)</text>
<text x="600.0" y="337.5" font-size="11.5" fill="#555555" text-anchor="middle">generated stub → skeleton</text>
<text x="600.0" y="352.5" font-size="11.5" fill="#555555" text-anchor="middle">HTTP/2 binary protobuf</text>
<rect x="430" y="400" width="340" height="100" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="600.0" y="440.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Fetching &amp; round trips</text>
<text x="600.0" y="457.5" font-size="11.5" fill="#555555" text-anchor="middle">1 call = 1 typed method</text>
<text x="600.0" y="472.5" font-size="11.5" fill="#555555" text-anchor="middle">streaming cuts more</text>
<rect x="430" y="515" width="340" height="90" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
