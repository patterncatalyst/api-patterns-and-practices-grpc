<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="30" width="410" height="320" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="50" font-size="12" font-weight="700" fill="#1d1d1d">HTTP/2 over TCP: one connection</text>
<rect x="470" y="30" width="410" height="320" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="482" y="50" font-size="12" font-weight="700" fill="#1d1d1d">HTTP/3 over QUIC: independent streams</text>
<rect x="60" y="65" width="330" height="50" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="225.0" y="88.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">TCP connection</text>
<text x="225.0" y="105.0" font-size="11.5" fill="#555555" text-anchor="middle">one ordered byte stream</text>
<rect x="60" y="150" width="100" height="55" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="110.0" y="175.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Stream A</text>
<text x="110.0" y="192.5" font-size="11.5" fill="#555555" text-anchor="middle">request/response</text>
<rect x="185" y="150" width="100" height="55" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="235.0" y="175.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Stream B</text>
<text x="235.0" y="192.5" font-size="11.5" fill="#555555" text-anchor="middle">request/response</text>
<rect x="310" y="150" width="100" height="55" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="360.0" y="175.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Stream C</text>
<text x="360.0" y="192.5" font-size="11.5" fill="#555555" text-anchor="middle">request/response</text>
<rect x="60" y="245" width="350" height="55" rx="9" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
<text x="235.0" y="270.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">1 lost TCP segment -&gt;</text>
<text x="235.0" y="287.5" font-size="11.5" fill="#dddddd" text-anchor="middle">ALL 3 streams stall for it</text>
<rect x="510" y="65" width="330" height="50" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="675.0" y="88.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">QUIC connection (UDP)</text>
<text x="675.0" y="105.0" font-size="11.5" fill="#555555" text-anchor="middle">independent per-stream delivery</text>
<rect x="510" y="150" width="100" height="55" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="560.0" y="175.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Stream A</text>
<text x="560.0" y="192.5" font-size="11.5" fill="#555555" text-anchor="middle">flows normally</text>
<rect x="635" y="150" width="100" height="55" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="685.0" y="168.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Stream B</text>
<text x="685.0" y="185.0" font-size="11.5" fill="#555555" text-anchor="middle">1 lost packet,</text>
<text x="685.0" y="200.0" font-size="11.5" fill="#555555" text-anchor="middle">retransmits alone</text>
<rect x="760" y="150" width="100" height="55" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="810.0" y="175.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Stream C</text>
<text x="810.0" y="192.5" font-size="11.5" fill="#555555" text-anchor="middle">flows normally</text>
<path d="M110,115 L110,150" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M235,115 L235,150" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M360,115 L360,150" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M110,205 L110,245" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M235,205 L235,245" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M360,205 L360,245" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M560,115 L560,150" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M685,115 L685,150" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M810,115 L810,150" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="235" y="325" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">Transport-level head-of-line blocking (TCP, not HTTP)</text>
<text x="685" y="240" font-size="11" fill="#1d1d1d" text-anchor="middle">A and C are never blocked by B&#x27;s retransmit</text>
<text x="685" y="275" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">No cross-stream head-of-line blocking</text>
<text x="685" y="300" font-size="11" fill="#1d1d1d" text-anchor="middle">+ 0-RTT resumption, + connection migration</text>
</svg>