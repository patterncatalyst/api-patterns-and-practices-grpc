<text x="555.0" y="398.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Every call starts at roughly the same moment and</text>
<text x="555.0" y="415.0" font-size="11.5" fill="#555555" text-anchor="middle">blocks its OWN worker thread independently;</text>
<text x="555.0" y="430.0" font-size="11.5" fill="#555555" text-anchor="middle">no thread waits on another thread&#x27;s I/O.</text>
<text x="555.0" y="445.0" font-size="11.5" fill="#555555" text-anchor="middle">Total wall-clock time tracks ONE call&#x27;s ~400ms,</text>
<text x="555.0" y="460.0" font-size="11.5" fill="#555555" text-anchor="middle">not 8 calls&#x27; combined 3.2s.</text>
<text x="555.0" y="475.0" font-size="11.5" fill="#555555" text-anchor="middle">This is the overlap verify.sh&#x27;s &lt; 2.5s bound checks for.</text>
