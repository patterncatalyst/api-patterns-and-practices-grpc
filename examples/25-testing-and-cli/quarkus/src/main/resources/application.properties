# Ch25 testing-and-cli — Quarkus RoutingService.
#
# gRPC server: listens on its own port (NOT the HTTP port), bound to 0.0.0.0
# so it is reachable from outside the container. Container port 9000, mapped
# to host 9250 by compose.yaml.
quarkus.grpc.server.port=9000
quarkus.grpc.server.host=0.0.0.0

# Server reflection is on by default in dev mode only. This chapter's whole
# point is that grpcurl's `list`/`describe` (the grpcui/Insomnia/Yaak
# stand-in) and @QuarkusTest's own @GrpcClient both need it ON in the
# packaged container, so it is explicit here.
quarkus.grpc.server.enable-reflection-service=true

# OTLP endpoint for the opt-in `observability` compose profile. Falls back to
# the OTel SDK default (http://localhost:4317) when OTEL_EXPORTER_OTLP_ENDPOINT
# is unset, which simply fails to export (logged, non-fatal) when no
# collector is listening — the service starts and serves GetQuote either way.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=ch25-routing-quarkus
