[project]
name = "shipping-python-ch25-testing"
version = "1.0.0"
description = "Ch25 testing-and-cli — gRPC RoutingService.GetQuote (Python side), gated by a real in-process grpc.aio pytest suite run at image-build time."
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.75,<2",
    "grpcio-reflection>=1.75,<2",
    "protobuf>=5,<7",
    "opentelemetry-distro>=0.50b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    "opentelemetry-instrumentation-grpc>=0.50b0",
]

# grpcio-tools generates stubs from contracts/proto/ at build time; pytest +
# pytest-asyncio run the in-process suite in the SAME build stage (see
# Containerfile) — none of the three ship in the runtime image.
[dependency-groups]
dev = [
    "grpcio-tools>=1.75,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
