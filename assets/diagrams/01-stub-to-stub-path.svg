<text x="882.5" y="203.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">generates</text>
<text x="882.5" y="203.5" font-size="11" fill="#b8650a" text-anchor="middle">generates</text>
<path d="M215,320 L430,490" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="312.5" y="395.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">typed call in</text>
<text x="312.5" y="395.0" font-size="11" fill="#555" text-anchor="middle">typed call in</text>
<path d="M770,490 L985,320" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="887.5" y="395.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">typed call out</text>
<text x="887.5" y="395.0" font-size="11" fill="#555" text-anchor="middle">typed call out</text>
<path d="M600,550 L600,590" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="690.0" y="572.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">no text form on the wire</text>
<text x="690.0" y="572.0" font-size="11" fill="#555" text-anchor="middle">no text form on the wire</text>
<text x="600" y="678" font-size="12" fill="#555555" text-anchor="middle">One .proto compiles into both sides; nothing on this path is hand-written or typed as text.</text>
</svg>