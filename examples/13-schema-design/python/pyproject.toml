[project]
name = "shipping-python-ch13-schema"
version = "1.0.0"
description = "Ch13 schema design — gRPC RoutingService.ListRoutes pagination + FieldMask (Python side)."
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.83,<2",
    "grpcio-reflection>=1.83,<2",
    # grpcio-status carries google.rpc.status_pb2 and error_details_pb2
    # (BadRequest), reused here for an invalid page_token or field_mask path —
    # same runtime library Ch11 uses, not generated from this chapter's .proto.
    "grpcio-status>=1.83,<2",
    "protobuf>=6.33.5,<8",
    "opentelemetry-distro>=0.50b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    "opentelemetry-instrumentation-grpc>=0.50b0",
]

# grpcio-tools is build-time only (generates stubs from contracts/proto/ —
# see Containerfile); the runtime image never needs it.
[dependency-groups]
dev = [
    "grpcio-tools>=1.83,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
