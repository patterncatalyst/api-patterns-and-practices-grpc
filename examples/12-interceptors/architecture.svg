<text x="20" y="410" font-size="11" fill="#1d1d1d" text-anchor="start">Both stacks register the SAME AuthLoggingInterceptor contract in front of RoutingService: logs+times every call, rejects a missing &#x27;authorization&#x27; entry with UNAUTHENTICATED before GetQuote runs.</text>
<text x="20" y="440" font-size="11" fill="#1d1d1d" text-anchor="start">grafana/otel-lgtm is opt-in (--profile observability, OTLP :4317); both services start and serve GetQuote without it.</text>
