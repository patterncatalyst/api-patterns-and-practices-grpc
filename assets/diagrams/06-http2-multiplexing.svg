<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="20" width="1080" height="110" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="40" font-size="12" font-weight="700" fill="#1d1d1d">one TCP connection, one TLS handshake, opened once</text>
<rect x="20" y="140" width="1080" height="330" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="160" font-size="12" font-weight="700" fill="#1d1d1d">frames interleaved on the wire, in actual send order (left to right)</text>
<rect x="20" y="490" width="1080" height="130" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="510" font-size="12" font-weight="700" fill="#1d1d1d">HPACK header table (per connection, both directions)</text>
<rect x="40" y="55" width="150" height="50" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="115.0" y="78.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Client</text>
<text x="115.0" y="95.0" font-size="11.5" fill="#555555" text-anchor="middle">booking service</text>
<rect x="930" y="55" width="150" height="50" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="1005.0" y="78.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Server</text>
<text x="1005.0" y="95.0" font-size="11.5" fill="#555555" text-anchor="middle">RoutingService</text>
<rect x="140" y="185" width="92" height="50" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="186.0" y="208.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">S5 HEADERS</text>
<text x="186.0" y="225.0" font-size="11.5" fill="#555555" text-anchor="middle">:path GetQuote</text>
<rect x="352" y="185" width="92" height="50" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="398.0" y="208.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">S5 DATA</text>
<text x="398.0" y="225.0" font-size="11.5" fill="#555555" text-anchor="middle">request</text>
<rect x="776" y="185" width="92" height="50" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="822.0" y="208.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">S5 DATA+END</text>
<text x="822.0" y="225.0" font-size="11.5" fill="#555555" text-anchor="middle">response</text>
<rect x="246" y="285" width="92" height="50" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="292.0" y="308.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">S7 HEADERS</text>
<text x="292.0" y="325.0" font-size="11.5" fill="#555555" text-anchor="middle">:path ListRoutes</text>
<rect x="564" y="285" width="92" height="50" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="610.0" y="308.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">S7 DATA</text>
<text x="610.0" y="325.0" font-size="11.5" fill="#555555" text-anchor="middle">request</text>
<rect x="882" y="285" width="92" height="50" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="928.0" y="308.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">S7 DATA+END</text>
<text x="928.0" y="325.0" font-size="11.5" fill="#555555" text-anchor="middle">response</text>
<rect x="458" y="385" width="92" height="50" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="504.0" y="408.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">S9 HEADERS</text>
<text x="504.0" y="425.0" font-size="11.5" fill="#555555" text-anchor="middle">:path FindOptimalRoute</text>
<rect x="670" y="385" width="92" height="50" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="716.0" y="408.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">S9 DATA</text>
<text x="716.0" y="425.0" font-size="11.5" fill="#555555" text-anchor="middle">request</text>
<rect x="988" y="385" width="92" height="50" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="1034.0" y="408.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">S9 DATA+END</text>
<text x="1034.0" y="425.0" font-size="11.5" fill="#555555" text-anchor="middle">response</text>
<rect x="60" y="515" width="460" height="85" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="290.0" y="548.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">HPACK static + dynamic table</text>
<text x="290.0" y="565.0" font-size="11.5" fill="#555555" text-anchor="middle">:path, content-type, grpc-timeout</text>
<text x="290.0" y="580.0" font-size="11.5" fill="#555555" text-anchor="middle">sent once; later HEADERS reference an index</text>
<rect x="560" y="515" width="460" height="85" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="790.0" y="548.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Effect</text>
<text x="790.0" y="565.0" font-size="11.5" fill="#555555" text-anchor="middle">one TLS handshake total, not one per stream</text>
<text x="790.0" y="580.0" font-size="11.5" fill="#555555" text-anchor="middle">stream 9 never waits behind stream 5&#x27;s frames</text>
