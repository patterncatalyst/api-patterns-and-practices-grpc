<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="20" width="560" height="560" rx="12" fill="#f4f8fc" stroke="#ddd"/>
<text x="32" y="40" font-size="12" font-weight="700" fill="#1d1d1d">Client-streaming — ReportPositions</text>
<rect x="610" y="20" width="570" height="560" rx="12" fill="#f4f8fc" stroke="#ddd"/>
<text x="622" y="40" font-size="12" font-weight="700" fill="#1d1d1d">Bidirectional — Sync</text>
<rect x="55" y="90" width="150" height="60" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="130.0" y="118.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Client</text>
<text x="130.0" y="135.0" font-size="11.5" fill="#555555" text-anchor="middle">sends 3 requests</text>
<rect x="395" y="90" width="150" height="60" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="470.0" y="118.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">TrackingService</text>
<text x="470.0" y="135.0" font-size="11.5" fill="#555555" text-anchor="middle">ReportPositions</text>
<rect x="55" y="420" width="150" height="60" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="130.0" y="448.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">half-close</text>
<text x="130.0" y="465.0" font-size="11.5" fill="#555555" text-anchor="middle">&quot;done sending&quot;</text>
<rect x="215" y="300" width="320" height="70" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="375.0" y="333.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">ONE response folds all 3</text>
<text x="375.0" y="350.0" font-size="11.5" fill="#555555" text-anchor="middle">accepted_count = 3</text>
<rect x="645" y="90" width="150" height="60" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="720.0" y="118.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Client</text>
<text x="720.0" y="135.0" font-size="11.5" fill="#555555" text-anchor="middle">reads + writes</text>
<rect x="985" y="90" width="150" height="60" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="1060.0" y="118.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">TrackingService</text>
<text x="1060.0" y="135.0" font-size="11.5" fill="#555555" text-anchor="middle">Sync</text>
<rect x="805" y="480" width="320" height="70" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="965.0" y="513.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">independent read/write directions</text>
<text x="965.0" y="530.0" font-size="11.5" fill="#555555" text-anchor="middle">order preserved within each</text>
<path d="M205,112 L395,112" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="306.0" y="106.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">req 1</text>
<text x="306.0" y="106.0" font-size="11" fill="#555" text-anchor="middle">req 1</text>
<path d="M205,140 L395,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="306.0" y="134.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">req 2</text>
<text x="306.0" y="134.0" font-size="11" fill="#555" text-anchor="middle">req 2</text>
<path d="M205,168 L395,168" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="306.0" y="162.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">req 3</text>
<text x="306.0" y="162.0" font-size="11" fill="#555" text-anchor="middle">req 3</text>
<path d="M130,150 L130,420" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M395,220 L215,335" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="311.0" y="271.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">ReportPositionsResponse</text>
<text x="311.0" y="271.5" font-size="11" fill="#b8650a" text-anchor="middle">ReportPositionsResponse</text>
<path d="M795,112 L985,112" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="896.0" y="106.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">req 1 →</text>
<text x="896.0" y="106.0" font-size="11" fill="#555" text-anchor="middle">req 1 →</text>
<path d="M985,150 L795,150" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="896.0" y="144.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">← resp 1</text>
<text x="896.0" y="144.0" font-size="11" fill="#b8650a" text-anchor="middle">← resp 1</text>
<path d="M795,188 L985,188" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="896.0" y="182.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">req 2 →</text>
<text x="896.0" y="182.0" font-size="11" fill="#555" text-anchor="middle">req 2 →</text>
<path d="M985,226 L795,226" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="896.0" y="220.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">← resp 2</text>
<text x="896.0" y="220.0" font-size="11" fill="#b8650a" text-anchor="middle">← resp 2</text>
<path d="M720,150 L720,480" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="55" y="490" font-size="11" fill="#1d1d1d" text-anchor="start">Half-close signals &quot;no more requests&quot; without closing</text>
<text x="55" y="508" font-size="11" fill="#1d1d1d" text-anchor="start">the response direction — the server still owes one reply.</text>
<text x="645" y="420" font-size="11" fill="#1d1d1d" text-anchor="start">Read and write are independent directions on one HTTP/2</text>
<text x="645" y="438" font-size="11" fill="#1d1d1d" text-anchor="start">stream; this handler happens to answer as each request</text>
<text x="645" y="456" font-size="11" fill="#1d1d1d" text-anchor="start">arrives, but the protocol itself doesn&#x27;t require lockstep.</text>
</svg>