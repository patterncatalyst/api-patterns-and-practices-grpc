<path d="M430,430 L500,460" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M430,510 L500,470" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="450" y="540" font-size="13" fill="#1d1d1d" text-anchor="middle">Server-owned cancellation stops the job; request-scoped cancellation only stops the client from watching it.</text>
