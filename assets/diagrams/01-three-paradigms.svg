<text x="205.0" y="200.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Mental model</text>
<text x="205.0" y="217.5" font-size="11.5" fill="#555555" text-anchor="middle">Nouns + HTTP verbs</text>
<text x="205.0" y="232.5" font-size="11.5" fill="#555555" text-anchor="middle">transfer resource state</text>
<rect x="35" y="275" width="340" height="110" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="205.0" y="320.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">POST /bookings/{id}/quote-request</text>
<text x="205.0" y="337.5" font-size="11.5" fill="#555555" text-anchor="middle">or GET /routes?origin=...&amp;dest=...</text>
<text x="205.0" y="352.5" font-size="11.5" fill="#555555" text-anchor="middle">JSON body, HTTP/1.1 or h2</text>
<rect x="35" y="400" width="340" height="100" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="205.0" y="440.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Fetching &amp; round trips</text>
<text x="205.0" y="457.5" font-size="11.5" fill="#555555" text-anchor="middle">1 call = 1 resource</text>
<text x="205.0" y="472.5" font-size="11.5" fill="#555555" text-anchor="middle">related data = more calls</text>
