<text x="600.0" y="575.0" font-size="11.5" fill="#555555" text-anchor="middle">compiles to client + server code</text>
<rect x="825" y="160" width="340" height="100" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="995.0" y="200.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Mental model</text>
<text x="995.0" y="217.5" font-size="11.5" fill="#555555" text-anchor="middle">One graph, client traverses</text>
<text x="995.0" y="232.5" font-size="11.5" fill="#555555" text-anchor="middle">shape the response per query</text>
<rect x="825" y="275" width="340" height="110" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="995.0" y="320.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">POST /graphql</text>
<text x="995.0" y="337.5" font-size="11.5" fill="#555555" text-anchor="middle">{ quote(origin, dest, cargo) }</text>
<text x="995.0" y="352.5" font-size="11.5" fill="#555555" text-anchor="middle">JSON body over HTTP POST</text>
<rect x="825" y="400" width="340" height="100" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="995.0" y="440.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Fetching &amp; round trips</text>
<text x="995.0" y="457.5" font-size="11.5" fill="#555555" text-anchor="middle">1 request, client-shaped</text>
<text x="995.0" y="472.5" font-size="11.5" fill="#555555" text-anchor="middle">server resolves the graph</text>
