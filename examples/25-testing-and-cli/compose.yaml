# Ch25 testing-and-cli — compose topology for
# shipping.routing.v1.RoutingService.GetQuote on both stacks, plus the
# CI-gated test re-run services and a pinned ghz load generator.
#
# Both services are generated from the SAME proto
# (contracts/proto/shipping/{type,routing}/v1/*.proto) and implement
# GetQuote identically — see README.md. The build context for both is the
# REPO ROOT so each Containerfile can COPY the two proto files it needs
# straight from contracts/ — see quarkus/Containerfile and
# python/Containerfile for the exact COPY lines.
#
# THE GATE already fired once by the time `quarkus`/`python` finish
# building: each Containerfile's build stage runs `mvn verify` / `pytest`
# unconditionally, so a broken RoutingServiceImpl never produces a runnable
# image in the first place. `quarkus-tests` / `python-tests` below are a
# SEPARATE one-shot re-run of the same suites — built from the SAME
# Containerfile stopped at its `build` target — so verify.sh can surface a
# fresh, readable PASS/FAIL in its own log without re-parsing `docker build`
# output.
#
# The LGTM observability stack is opt-in (`--profile observability`) so CI
# and a first boot stay fast; both apps are wired for OTLP export but start
# and serve GetQuote fine without a collector listening.
#
# Usage:
#   docker compose up --build                            # app stack only
#   docker compose --profile observability up --build    # + Grafana LGTM
#   docker compose run --rm quarkus-tests                 # re-run mvn test
#   docker compose run --rm python-tests                  # re-run pytest
#   docker compose run --rm ghz --insecure \
#     --proto /contracts/shipping/routing/v1/routing.proto \
#     --import-paths /contracts \
#     --call shipping.routing.v1.RoutingService.GetQuote \
#     -d '{...}' -c 10 -n 300 -O json quarkus:9000

services:
  quarkus:
    build:
      context: ../..
      dockerfile: examples/25-testing-and-cli/quarkus/Containerfile
    container_name: ch25-routing-quarkus
    ports:
      - "9250:9000"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4317

  python:
    build:
      context: ../..
      dockerfile: examples/25-testing-and-cli/python/Containerfile
    container_name: ch25-routing-python
    ports:
      - "9251:9000"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4317

  # ─── One-shot test re-runs (profiled off; `docker compose run` only) ──────
  # Built from the SAME Containerfile, stopped at the `build` stage (source,
  # pom.xml/pyproject.toml, generated stubs, and the test suite are all still
  # present there — stage 2 discards every one of them). The entrypoint
  # override re-invokes the test runner directly so its own pass/fail output
  # lands in THIS command's log, independent of `docker build`'s log.
  quarkus-tests:
    build:
      context: ../..
      dockerfile: examples/25-testing-and-cli/quarkus/Containerfile
      target: build
    profiles: ["tests"]
    entrypoint: ["mvn", "-B", "test"]

  python-tests:
    build:
      context: ../..
      dockerfile: examples/25-testing-and-cli/python/Containerfile
      target: build
    profiles: ["tests"]
    environment:
      - PYTHONPATH=/app/generated:/app
    entrypoint: [".venv/bin/python", "-m", "pytest", "tests", "-v"]

  # ─── ghz load generator (one-shot; `docker compose run`, never `up`) ───────
  # Profiled off so a plain `docker compose up`/compose_up never starts it;
  # `docker compose run --rm ghz ...` auto-enables a service's own profile,
  # so no extra flag is needed to invoke it. contracts/proto/ is mounted
  # read-only so ghz can be fed the .proto directly — ghz has no server
  # reflection support, unlike grpcurl.
  #
  # Image pin: ghcr.io/bojand/ghz 0.121.0 — same pin as Ch18's exact pattern
  # (bojand/ghz is NOT published to docker.io, only to ghcr.io — verified
  # there with `skopeo list-tags docker://ghcr.io/bojand/ghz`). Re-check the
  # same way before bumping.
  ghz:
    image: ghcr.io/bojand/ghz:0.121.0
    profiles: ["ghz"]
    volumes:
      - ../../contracts/proto:/contracts:ro

  # ─── Observability (opt-in) ────────────────────────────────────────────
  # `docker compose --profile observability up` to include. Off by default
  # so CI's examples job (and a first boot) stay fast. The OTEL_EXPORTER_*
  # env vars above point at this service's name, which only resolves when
  # the profile is active — harmless (just unreachable) otherwise.
  lgtm:
    image: docker.io/grafana/otel-lgtm:0.36.0
    container_name: ch25-lgtm
    profiles: ["observability"]
    ports:
      - "3000:3000" # Grafana UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "9090:9090" # Prometheus / Mimir query
      - "3100:3100" # Loki
      - "3200:3200" # Tempo
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
