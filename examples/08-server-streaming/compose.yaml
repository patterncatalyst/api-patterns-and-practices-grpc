# Ch8 server-streaming example — compose topology for
# shipping.tracking.v1.TrackingService.WatchShipment.
#
# Default `docker compose up` brings up: quarkus, python. Both are generated
# from the SAME proto (contracts/proto/shipping/{type,tracking}/v1/*.proto)
# and implement WatchShipment identically (see ./README.md for the
# deterministic 4-event sequence). The build context for both services is
# the REPO ROOT so each Containerfile can COPY the two proto files it needs
# straight from contracts/ (the single source of truth) — see
# quarkus/Containerfile and python/Containerfile for the exact COPY lines.
#
# Ports: quarkus host 9080 -> container 9000, python host 9081 -> container
# 9000 (Ch5's 9005/9006 stay free for that chapter's own stack).
#
# The LGTM observability stack is opt-in (`--profile observability`) so CI
# and a first boot stay fast; both apps are wired for OTLP export but start
# and serve WatchShipment fine without a collector listening.
#
# Usage:
#   docker compose up --build                          # app stack only
#   docker compose --profile observability up --build  # + Grafana LGTM

services:
  quarkus:
    build:
      context: ../..
      dockerfile: examples/08-server-streaming/quarkus/Containerfile
    container_name: ch08-tracking-quarkus
    ports:
      - "9080:9000"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4317

  python:
    build:
      context: ../..
      dockerfile: examples/08-server-streaming/python/Containerfile
    container_name: ch08-tracking-python
    ports:
      - "9081:9000"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4317

  # ─── Observability (opt-in) ────────────────────────────────────────────
  # `docker compose --profile observability up` to include. Off by default
  # so CI's examples job (and a first boot) stay fast. The OTEL_EXPORTER_*
  # env vars above point at this service's name, which only resolves when
  # the profile is active — harmless (just unreachable) otherwise.
  lgtm:
    image: docker.io/grafana/otel-lgtm:0.36.0
    container_name: ch08-lgtm
    profiles: ["observability"]
    ports:
      - "3000:3000" # Grafana UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "9090:9090" # Prometheus / Mimir query
      - "3100:3100" # Loki
      - "3200:3200" # Tempo
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
