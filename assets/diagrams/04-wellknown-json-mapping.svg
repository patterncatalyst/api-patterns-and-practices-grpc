<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="30" width="400" height="410" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="50" font-size="12" font-weight="700" fill="#1d1d1d">proto3 wire message</text>
<rect x="460" y="30" width="420" height="280" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="472" y="50" font-size="12" font-weight="700" fill="#1d1d1d">proto3 JSON (canonical, camelCase)</text>
<rect x="460" y="330" width="420" height="110" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="472" y="350" font-size="12" font-weight="700" fill="#1d1d1d">what grpcurl prints back</text>
<rect x="50" y="70" width="340" height="140" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="220.0" y="123.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Leg (proto3 message)</text>
<text x="220.0" y="140.0" font-size="11.5" fill="#555555" text-anchor="middle">carrier: string</text>
<text x="220.0" y="155.0" font-size="11.5" fill="#555555" text-anchor="middle">departs_at: google.protobuf.Timestamp</text>
<text x="220.0" y="170.0" font-size="11.5" fill="#555555" text-anchor="middle">arrives_at: google.protobuf.Timestamp</text>
<rect x="50" y="240" width="340" height="100" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="220.0" y="280.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Money (proto3 message)</text>
<text x="220.0" y="297.5" font-size="11.5" fill="#555555" text-anchor="middle">currency: string</text>
<text x="220.0" y="312.5" font-size="11.5" fill="#555555" text-anchor="middle">amount: string  (decimal, never a float)</text>
<rect x="500" y="70" width="340" height="140" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="670.0" y="123.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">leg  (wire + library JSON)</text>
<text x="670.0" y="140.0" font-size="11.5" fill="#555555" text-anchor="middle">&quot;carrier&quot;: &quot;MAERSK&quot;</text>
<text x="670.0" y="155.0" font-size="11.5" fill="#555555" text-anchor="middle">&quot;departsAt&quot;: &quot;2026-02-01T10:00:00Z&quot;</text>
<text x="670.0" y="170.0" font-size="11.5" fill="#555555" text-anchor="middle">&quot;arrivesAt&quot;: &quot;2026-02-18T06:00:00Z&quot;</text>
<rect x="500" y="230" width="340" height="70" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="670.0" y="258.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">price  (wire + library JSON)</text>
<text x="670.0" y="275.0" font-size="11.5" fill="#555555" text-anchor="middle">&quot;currency&quot;: &quot;USD&quot;</text>
<text x="670.0" y="290.0" font-size="11.5" fill="#555555" text-anchor="middle">&quot;amount&quot;: &quot;4200.00&quot;   (string, not a number)</text>
<rect x="500" y="360" width="340" height="70" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="670.0" y="393.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">grpcurl&#x27;s printed OUTPUT (default)</text>
<text x="670.0" y="410.0" font-size="11.5" fill="#555555" text-anchor="middle">&quot;departs_at&quot;: &quot;...&quot;  — snake_case, same value</text>
<path d="M390,120 L500,120" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="451.0" y="114.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">proto3 JSON mapping</text>
<text x="451.0" y="114.0" font-size="11" fill="#b8650a" text-anchor="middle">proto3 JSON mapping</text>
<path d="M390,275 L500,275" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="451.0" y="269.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">proto3 JSON mapping</text>
<text x="451.0" y="269.0" font-size="11" fill="#b8650a" text-anchor="middle">proto3 JSON mapping</text>
<path d="M670,300 L670,360" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="670.0" y="320.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">grpcurl renders, doesn&#x27;t send</text>
<text x="670.0" y="320.0" font-size="11" fill="#555" text-anchor="middle">grpcurl renders, doesn&#x27;t send</text>
<text x="30" y="465" font-size="11" fill="#555555" text-anchor="start">grpcurl ACCEPTS camelCase or snake_case on input, but PRINTS responses in snake_case by default — the wire/library JSON above is camelCase either way.</text>
</svg>